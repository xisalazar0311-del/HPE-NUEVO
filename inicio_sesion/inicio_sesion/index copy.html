<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>HPE| Login</title>
    <!-- Google Fonts: Inter & Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Space Grotesk', sans-serif;
            background: radial-gradient(circle at 20% 30%, #0a0f14, #030507);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
            z-index: 0;
        }

        .tech-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.4;
            z-index: 0;
            animation: floatOrb 18s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 40vw;
            height: 40vw;
            background: #00ffff20;
            top: -15vh;
            right: -10vw;
        }

        .orb-2 {
            width: 35vw;
            height: 35vw;
            background: #0ff5b020;
            bottom: -20vh;
            left: -5vw;
            animation-duration: 24s;
        }

        .orb-3 {
            width: 25vw;
            height: 25vw;
            background: #0a7f8f30;
            top: 40%;
            left: 30%;
            animation-duration: 20s;
            opacity: 0.25;
        }

        @keyframes floatOrb {
            0% {
                transform: translate(0, 0) scale(1);
            }
            100% {
                transform: translate(5%, 8%) scale(1.1);
            }
        }

        /* Contenedor principal - MÁS GRANDE EN MÓVIL */
        .login-container {
            position: center;
            z-index: 10;
            width: 100%;
            max-width: 520px;
            margin: 0 auto;
            background: rgba(18, 22, 28, 0.85);
            backdrop-filter: blur(14px);
            border-radius: 2rem;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 255, 255, 0.1);
            padding: 2rem 2rem 2.5rem 2rem;
            transition: all 0.3s ease;
        }

        .login-container:hover {
            border-color: rgba(0, 255, 255, 0.6);
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6), 0 0 28px rgba(0, 255, 255, 0.3);
        }

        /* MEDIA QUERY MÓVIL - CONTAINER MÁS GRANDE */
        @media (max-width: 560px) {
            body {
                padding: 1rem;
        align-items: center;  /* ← CENTRADO vertical */
        justify-content: center;
        min-height: 100vh;
            }
            
            .login-container {
                max-width: 100%;
                padding: 1.8rem 1.5rem 2.2rem 1.5rem;
                border-radius: 1.8rem;
                margin: 0.5rem;
            }
        }

        @media (max-width: 400px) {
            .login-container {
                padding: 1.5rem 1.2rem 2rem 1.2rem;
            }
        }

        .tech-header {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .logo-svg {
            width: 100px;
            height: 100px;
            margin: 0 auto 0.2rem auto;
            display: flex;
            justify-content: center;
            align-items: center;
            filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.5));
            transition: transform 0.3s ease;
        }

        .logo-svg:hover {
            transform: scale(1.05);
        }

        .logo-svg svg {
            width: 100%;
            height: 100%;
        }

        /* Móvil - logo más grande */
        @media (max-width: 560px) {
            .logo-svg {
                width: 85px;
                height: 85px;
            }
        }

        h1 {
            font-family: 'Space Grotesk', monospace;
            font-weight: 600;
            font-size: clamp(1.5rem, 6vw, 1.9rem);
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #eef5ff, #0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }

        .sub {
            color: #9ca3af;
            font-size: clamp(0.7rem, 3vw, 0.85rem);
            letter-spacing: 0.3px;
            border-top: 1px dashed #2c3e44;
            display: inline-block;
            padding-top: 0.6rem;
            margin-top: 0.3rem;
        }

        /* INPUTS MÁS GRANDES EN MÓVIL */
        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        @media (max-width: 560px) {
            .input-group {
                margin-bottom: 1.8rem;
            }
        }

        .input-group i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #0ff;
            font-size: 1.2rem;
            transition: 0.2s;
            z-index: 2;
            opacity: 0.7;
        }

        .input-group input {
            width: 100%;
            background: rgba(10, 14, 18, 0.8);
            border: 1px solid #2a3a44;
            border-radius: 2rem;
            padding: 1rem 1rem 1rem 2.8rem;
            font-size: clamp(0.9rem, 4.5vw, 1rem);
            font-family: 'Inter', monospace;
            color: #eef2ff;
            font-weight: 500;
            transition: all 0.25s ease;
            outline: none;
        }

        /* Móvil - inputs más altos */
        @media (max-width: 560px) {
            .input-group input {
                padding: 1.1rem 1rem 1.1rem 2.8rem;
                font-size: 1rem;
            }
            
            .input-group i {
                font-size: 1.3rem;
                left: 1.1rem;
            }
        }

        .input-group input:focus {
            border-color: #0ff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
            background: rgba(10, 14, 18, 0.95);
        }

        .input-group input::placeholder {
            color: #6b7280;
            font-weight: 400;
            font-size: clamp(0.8rem, 3.5vw, 0.85rem);
        }

        /* BOTÓN MÁS GRANDE EN MÓVIL */
        .login-btn {
            width: 100%;
            background: linear-gradient(95deg, #0b2b2f, #0a1a1f);
            border: 1px solid #0ff;
            border-radius: 2.5rem;
            padding: clamp(0.9rem, 4.5vh, 1.1rem);
            font-size: clamp(0.95rem, 4.5vw, 1.05rem);
            font-weight: 600;
            font-family: 'Space Grotesk', monospace;
            color: #0ff;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 560px) {
            .login-btn {
                padding: 1rem;
                font-size: 1rem;
                margin-top: 0.5rem;
            }
        }

        .login-btn i {
            font-size: 1rem;
            transition: transform 0.2s;
        }

        .login-btn:hover {
            background: linear-gradient(95deg, #0f3a40, #0c262c);
            color: #cfffff;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            border-color: #8cfcff;
            transform: translateY(-2px);
        }

        .signup-section {
            text-align: center;
            margin-top: 2rem;
            color: #9aaebf;
            font-size: clamp(0.8rem, 3.5vw, 0.85rem);
        }

        .signup-link {
            color: #0ff;
            font-weight: 600;
            text-decoration: none;
            margin-left: 6px;
            transition: 0.2s;
            cursor: pointer;
        }

        .signup-link:hover {
            text-decoration: underline;
            text-shadow: 0 0 5px #0ff;
        }

        .error-message {
            background: rgba(255, 50, 50, 0.15);
            border-left: 3px solid #ff3366;
            color: #ffb3c6;
            font-size: clamp(0.75rem, 3vw, 0.8rem);
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            margin-top: 1rem;
            text-align: center;
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .success-message {
            background: rgba(0, 255, 255, 0.15);
            border-left: 3px solid #0ff;
            color: #0ff;
            font-size: clamp(0.75rem, 3vw, 0.8rem);
            padding: 0.8rem 1rem;
            border-radius: 1rem;
            margin-top: 1rem;
            text-align: center;
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }

        .btn-loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #0ff;
            animation: spin 0.8s linear infinite;
            margin-left: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .switch-mode {
            text-align: center;
            margin-bottom: 1.8rem;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid #2a3a44;
            color: #9ca3af;
            padding: 0.6rem 1.8rem;
            margin: 0 0.5rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Inter', monospace;
            font-weight: 500;
            font-size: 0.9rem;
        }

        @media (max-width: 560px) {
            .mode-btn {
                padding: 0.7rem 1.6rem;
                font-size: 0.95rem;
                margin: 0 0.4rem;
            }
            .switch-mode {
                margin-bottom: 1.5rem;
            }
        }

        .mode-btn.active {
            background: rgba(0, 255, 255, 0.2);
            border-color: #0ff;
            color: #0ff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .mode-btn:hover:not(.active) {
            border-color: #0ff;
            color: #0ff;
        }

        /* Pantalla de bienvenida */
        .welcome-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: radial-gradient(circle at 20% 30%, #0a0f14, #030507);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease, visibility 1s ease;
            opacity: 1;
            visibility: visible;
        }

        .welcome-screen.fade-out {
            opacity: 0;
            visibility: hidden;
        }

        .welcome-content {
            text-align: center;
            animation: pulseGlow 2s ease-in-out infinite;
            padding: 1rem;
        }

        @keyframes pulseGlow {
            0%, 100% {
                filter: drop-shadow(0 0 10px rgba(0, 255, 255, 0.5));
            }
            50% {
                filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.8));
            }
        }

        .welcome-svg {
            width: 180px;
            height: 180px;
            margin: 0 auto;
            animation: rotateScale 1.5s ease-out forwards;
        }

        @keyframes rotateScale {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.2) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(360deg);
                opacity: 1;
            }
        }

        @media (max-width: 560px) {
            .welcome-svg {
                width: 140px;
                height: 140px;
            }
        }

        .welcome-text {
            margin-top: 1.5rem;
            font-family: 'Space Grotesk', monospace;
            font-size: clamp(1.3rem, 6vw, 2rem);
            background: linear-gradient(135deg, #eef5ff, #0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: slideUp 0.8s ease-out 0.5s forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .welcome-subtext {
            margin-top: 0.8rem;
            color: #0ff;
            font-size: clamp(0.7rem, 4vw, 0.9rem);
            animation: slideUp 0.8s ease-out 0.8s forwards;
            opacity: 0;
            transform: translateY(20px);
            letter-spacing: 2px;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading-bar {
            width: 180px;
            height: 2px;
            background: rgba(0, 255, 255, 0.2);
            margin: 1.5rem auto 0;
            border-radius: 2px;
            overflow: hidden;
            animation: slideUp 0.8s ease-out 1.1s forwards;
            opacity: 0;
        }

        .loading-progress {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #0ff, #0a7f8f);
            animation: loading 2.5s ease-out forwards;
            border-radius: 2px;
        }

        @keyframes loading {
            0% {
                width: 0%;
            }
            100% {
                width: 100%;
            }
        }

        /* Contenido principal */
        .main-content {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.5s ease 0.3s;
        }

        .main-content.visible {
            opacity: 1;
        }
        
        /* Pantalla de éxito post-login */
        .success-dashboard {
            text-align: center;
            padding: 2rem;
        }
        
        .success-dashboard h2 {
            color: #0ff;
            margin: 1rem 0;
            font-size: clamp(1.2rem, 5vw, 1.8rem);
        }
        
        .success-dashboard p {
            color: #b0f0ff;
            font-size: clamp(0.8rem, 4vw, 1rem);
        }
        
        .success-dashboard .sub {
            margin-top: 1rem;
        }
    </style>
</head>

                            .hpe-logo .hpe-logo-half { opacity: 0 }
                            .hpe-logo.play .hpe-logo-half { animation: hpe-logo-half 0.4s ease-out 3s forwards; opacity: 0 }
                            @keyframes hpe-logo-half { to { opacity: 1 } }
                            .hpe-logo.play.css-animation #hpe-logo-gradient { animation: hpe-logo-gradient 5s linear 0s forwards }
                            @keyframes hpe-logo-gradient { 0% { transform: translateX(-70%) rotate(70deg) } 5% { transform: translateX(-70%) rotate(50deg) } 17.5% { transform: translateX(-55%) rotate(-20deg) } 22.5% { transform: translateX(-55%) rotate(-33deg) } 30% { transform: translateX(-60%) rotate(-16deg) } 40% { transform: translateX(-60%) rotate(30deg) } 50% { transform: translateX(-20%) rotate(30deg) } 55%, 100% { transform: translateX(0%) rotate(37deg) } }
                            .hpe-logo.play.css-animation #hpe-logo-gradient2 { animation: hpe-logo-gradient2 5s linear 0s forwards }

                            .hpe-logo.play.css-animation #hpe-half-gradient { animation: hpe-half-gradient 5s linear 0s forwards; scale: 1.2 }

                            <linearGradient gradientUnits="userSpaceOnUse" id="hpe-logo-gradient" x1="0" x2="630" y1="0" y2="180">

                                </animate>
                                <animate attributeName="x2" begin="hpe-logo-gradient-animate.begin+0s" dur="5s" fill="freeze"
                                    keyTimes="0;0.05;0.175;0.225;0.3;0.4;0.5;0.55;1" repeatCount="1"
                                    values="-394.67;-175.66;306.88;280.77;277.21;79.32;329.24;394.81;394.81"></animate>
                                <animate attributeName="y2" begin="hpe-logo-gradient-animate.begin+0s" dur="5s" fill="freeze"
                                    keyTimes="0;0.05;0.175;0.225;0.3;0.4;0.5;0.55;1" repeatCount="1"
                                    values="653.57;599.08;-42.55;-189.30;1.32;469.21;470.88;522.90;522.90"></animate>
                            </linearGradient>
                            <linearGradient gradientUnits="userSpaceOnUse" id="hpe-logo-gradient2" x1="0" x2="630" y1="0" y2="0">
                                <stop offset="0%" stop-color="#00e0af00" stop-opacity="0"></stop>
                                <stop offset="20%" stop-color="#00e0af"></stop>

    <script>
        // API Configuration - Cambia esta URL por la de tu backend
        const API_URL = 'http://localhost:3000/api';
        
        // DOM elements
        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const confirmPasswordGroup = document.getElementById('confirmPasswordGroup');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const errorMsgDiv = document.getElementById('errorMsg');
        const errorTextSpan = document.getElementById('errorText');
        const successMsgDiv = document.getElementById('successMsg');
        const successTextSpan = document.getElementById('successText');
        const actionBtn = document.getElementById('actionButton');
        const loginModeBtn = document.getElementById('loginModeBtn');
        const registerModeBtn = document.getElementById('registerModeBtn');
        
        let isLoginMode = true;
        
        function showError(message) {
            successMsgDiv.style.display = 'none';
            errorTextSpan.innerText = message;
            errorMsgDiv.style.display = 'flex';
            setTimeout(() => {
                if (errorMsgDiv.style.display === 'flex') {
                    errorMsgDiv.style.opacity = '0';
                    setTimeout(() => {
                        errorMsgDiv.style.display = 'none';
                        errorMsgDiv.style.opacity = '1';
                    }, 300);
                }
            }, 4000);
            errorMsgDiv.style.opacity = '1';
        }
        
        function showSuccess(message) {
            errorMsgDiv.style.display = 'none';
            successTextSpan.innerText = message;
            successMsgDiv.style.display = 'flex';
            setTimeout(() => {
                if (successMsgDiv.style.display === 'flex') {
                    successMsgDiv.style.opacity = '0';
                    setTimeout(() => {
                        successMsgDiv.style.display = 'none';
                        successMsgDiv.style.opacity = '1';
                    }, 300);
                }
            }, 3000);
            successMsgDiv.style.opacity = '1';
        }
        
        function hideMessages() {
            errorMsgDiv.style.display = 'none';
            successMsgDiv.style.display = 'none';
        }
        
        function setButtonLoading(isLoading, text) {
            const btnSpan = actionBtn.querySelector('span');
            const btnIcon = actionBtn.querySelector('i:last-child');
            if (isLoading) {
                actionBtn.disabled = true;
                actionBtn.style.opacity = '0.8';
                if (!actionBtn.querySelector('.btn-loader')) {
                    const loaderSpan = document.createElement('span');
                    loaderSpan.className = 'btn-loader';
                    if (btnIcon) btnIcon.style.display = 'none';
                    actionBtn.appendChild(loaderSpan);
                }
                if (btnSpan) btnSpan.innerText = text || 'PROCESSING';
            } else {
                actionBtn.disabled = false;
                actionBtn.style.opacity = '1';
                const loader = actionBtn.querySelector('.btn-loader');
                if (loader) loader.remove();
                const btnIconRestore = actionBtn.querySelector('i:last-child');
                if (btnIconRestore) btnIconRestore.style.display = 'inline-block';
                const btnSpanRestore = actionBtn.querySelector('span');
                if (btnSpanRestore) btnSpanRestore.innerText = isLoginMode ? 'LOGIN TO DASHBOARD' : 'CREATE ACCOUNT';
            }
        }
        
        function updateUIMode() {
            const btnSpan = actionBtn.querySelector('span');
            if (isLoginMode) {
                confirmPasswordGroup.style.display = 'none';
                confirmPasswordInput.required = false;
                if (btnSpan) btnSpan.innerText = 'LOGIN TO DASHBOARD';
                loginModeBtn.classList.add('active');
                registerModeBtn.classList.remove('active');
            } else {
                confirmPasswordGroup.style.display = 'block';
                confirmPasswordInput.required = true;
                if (btnSpan) btnSpan.innerText = 'CREATE ACCOUNT';
                registerModeBtn.classList.add('active');
                loginModeBtn.classList.remove('active');
            }
            hideMessages();
            emailInput.value = '';
            passwordInput.value = '';
            confirmPasswordInput.value = '';
        }
        
        loginModeBtn.addEventListener('click', () => {
            isLoginMode = true;
            updateUIMode();
        });
        
        registerModeBtn.addEventListener('click', () => {
            isLoginMode = false;
            updateUIMode();
        });
        
        async function loginUser(email, password) {
            const response = await fetch(`${API_URL}/login`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            return data;
        }
        
        async function registerUser(email, password) {
            const response = await fetch(`${API_URL}/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email, password })
            });
            
            const data = await response.json();
            return data;
        }
        
        function onLoginSuccess(data) {
            // Guardar token JWT en sessionStorage (se borra al cerrar el navegador)
            sessionStorage.setItem('hpe_token',  data.token);
            sessionStorage.setItem('hpe_email',  data.email);
            sessionStorage.setItem('hpe_nombre', data.nombre || data.email.split('@')[0]);
            sessionStorage.setItem('hpe_role',   data.role || 'user');
            window.location.href = '../../INDEX.HTML';
        }
        
        function onRegisterSuccess(email) {
            showSuccess(`✅ Account created successfully for ${email}! You can now login.`);
            setTimeout(() => {
                isLoginMode = true;
                updateUIMode();
                emailInput.value = '';
                passwordInput.value = '';
                confirmPasswordInput.value = '';
            }, 2000);
        }
        
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessages();
            
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            
            const emailRegex = /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showError("⚠️ Invalid email format.");
                return;
            }
            
            if (password.length < 4) {
                showError("🔒 Password must be at least 4 characters.");
                return;
            }
            
            if (!isLoginMode) {
                const confirmPassword = confirmPasswordInput.value;
                if (password !== confirmPassword) {
                    showError("❌ Passwords do not match.");
                    return;
                }
            }
            
            setButtonLoading(true, isLoginMode ? 'AUTHENTICATING' : 'CREATING ACCOUNT');
            
            try {
                if (isLoginMode) {
                    const result = await loginUser(email, password);
                    if (result.success) {
                        onLoginSuccess(result);
                    } else {
                        showError(result.message || "⛔ Authentication failed.");
                        const container = document.querySelector('.login-container');
                        container.style.transform = 'translateX(6px)';
                        setTimeout(() => { container.style.transform = ''; }, 100);
                        setTimeout(() => { container.style.transform = 'translateX(-4px)'; }, 200);
                        setTimeout(() => { container.style.transform = ''; }, 300);
                    }
                } else {
                    const result = await registerUser(email, password);
                    if (result.success) {
                        onRegisterSuccess(email);
                    } else {
                        showError(result.message || "❌ Registration failed.");
                    }
                }
            } catch (error) {
                console.error('Error:', error);
                showError("⚠️ Connection error. Make sure the backend server is running on port 3000");
            } finally {
                setButtonLoading(false);
            }
        });
        
        passwordInput.addEventListener('dblclick', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = passwordInput.parentElement.querySelector('i.fa-key');
            if (type === 'text') {
                icon.style.color = '#0ff';
                icon.style.textShadow = '0 0 5px cyan';
                setTimeout(() => {
                    if(passwordInput.getAttribute('type') === 'text') 
                        passwordInput.setAttribute('type', 'password');
                        icon.style.color = '';
                }, 2000);
            }
        });

        // Pantalla de bienvenida y transición
const welcomeScreen = document.getElementById('welcomeScreen');
const mainContent = document.getElementById('mainContent');
let transitionStarted = false;

// Función para mostrar el login
function showLoginContent() {
    if (transitionStarted) return;
    transitionStarted = true;
    
    console.log("Mostrando login...");
    welcomeScreen.classList.add('fade-out');
    mainContent.classList.add('visible');
    
    setTimeout(() => {
        if (welcomeScreen && welcomeScreen.parentNode) {
            welcomeScreen.style.display = 'none';
        }
    }, 1000);
}

// Detectar cuando termina la animación del logo
function waitForLogoAnimation() {
    // Buscar el SVG del logo dentro de la pantalla de bienvenida
    const logoSvg = welcomeScreen.querySelector('.hpe-logo');
    
    if (logoSvg) {
        // Escuchar cuando termine la animación principal
        logoSvg.addEventListener('animationend', (e) => {
            // Verificar que es la animación correcta (la del snake o la última)
            console.log("Animación detectada:", e.animationName);
            
            // Esperar 5 segundos adicionales después de que termine la animación
            setTimeout(() => {
                console.log("Mostrando login después de 2 segundos");
                showLoginContent();
            }, 1000);
        });
    } else {
        // Fallback por si no encuentra el SVG
        console.log("SVG no encontrado, usando timeout de 10 segundos");
        setTimeout(() => {
            showLoginContent();
        }, 1000);
    }
}

// También detectar cuando termine la animación de carga (loading-bar)
function waitForLoadingBar() {
    const loadingProgress = document.querySelector('.loading-progress');
    if (loadingProgress) {
        loadingProgress.addEventListener('animationend', () => {
            console.log("Barra de carga terminada");
            // No hacemos nada aquí, solo por si acaso
        });
    }
}

// Iniciar cuando la página cargue
window.addEventListener('load', () => {
    console.log("Página cargada, esperando animaciones...");
    waitForLogoAnimation();
    waitForLoadingBar();
});
